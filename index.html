<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>掃描文件</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="掃描文件">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#dde7f4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#dde7f4; --card:#fff; --thumb:#c9d7ea; --ink:#1b2333; --sub:#667085; --line:#e3e8f0;
  --pri:#1f6feb; --pri-ink:#fff; --soft:#e8f0fe; --danger:#d92d20; --stage:#111418;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --card:#1a1d24; --thumb:#262b35; --ink:#e8ebf1; --sub:#9aa3b2; --line:#2a2f3a;
    --pri:#4c8dff; --pri-ink:#fff; --soft:#1d2a44; --danger:#ff6b5e; --stage:#000;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;font-size:16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}

/* Home */
header{padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:22px;margin:0;flex:1}
.ghost{padding:8px 12px;border-radius:10px;color:var(--sub);font-size:14px}
.ghost:active{background:var(--line)}
#grid{flex:1;overflow:auto;padding:4px 16px 120px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;align-content:start}
.thumb{position:relative;background:var(--thumb);border-radius:12px;padding:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
.thumb img{max-width:100%;max-height:100%;border-radius:3px;box-shadow:0 1px 6px rgba(20,40,80,.25)}
.thumb .no{position:absolute;left:6px;top:6px;background:var(--pri);color:#fff;font-size:12px;font-weight:600;border-radius:99px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:60px 20px;line-height:1.7}
.empty .big{font-size:56px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:10px;background:linear-gradient(transparent,var(--bg) 30%)}
.btn{flex:1;height:52px;border-radius:14px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.1);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--pri);color:var(--pri-ink)}
.btn:disabled{opacity:.45}
.btn:active{transform:scale(.98)}

/* Crop + page editor (dark stage) */
.dark{background:var(--stage);color:#fff}
.dark .top{padding:calc(env(safe-area-inset-top) + 10px) 12px 8px;display:flex;align-items:center;gap:8px}
.dark .top .t{flex:1;text-align:center;font-weight:600}
.dark .tbtn{padding:8px 12px;border-radius:10px;color:#cfd6e4;font-size:15px}
.dark .tbtn.go{color:#fff;background:var(--pri);font-weight:600}
.dark .tbtn:active{background:#ffffff22}
.stageWrap{flex:1;position:relative;overflow:hidden;touch-action:none}
#stage{position:absolute}
#stage canvas{display:block;width:100%;height:100%}
#stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.handle{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--pri),0 1px 6px #000a;pointer-events:none}
.ehandle{position:absolute;width:36px;height:10px;margin:-5px 0 0 -18px;border-radius:5px;background:#fff;box-shadow:0 0 0 2px var(--pri),0 1px 4px #0009;pointer-events:none}
.handle.on{border-color:#ffd54a}.ehandle.on{background:#ffd54a}
#loupe{position:absolute;width:150px;height:150px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 12px #000c;pointer-events:none;background:#000;z-index:2}
.tools{display:flex;justify-content:center;gap:6px;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);flex-wrap:wrap}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:#cfd6e4;padding:6px 10px;border-radius:10px;min-width:58px}
.tool svg{width:24px;height:24px}
.tool:active{background:#ffffff22}
.tool.danger{color:#ff8a80}
.chips{display:flex;gap:8px;justify-content:center;padding:8px 12px 0;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:99px;background:#ffffff1a;color:#e6eaf2;font-size:14px}
.chip.on{background:#fff;color:#111}
.preview{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}
.preview img{max-width:100%;max-height:100%;box-shadow:0 2px 16px #0009}
.hint{text-align:center;color:#9aa3b2;font-size:13px;padding:0 16px}

/* Sheet */
.mask{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 14px;font-size:18px}
.lbl{font-size:13px;color:var(--sub);margin:14px 0 6px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px}
.seg button{flex:1;padding:10px 4px;border-radius:9px;font-size:15px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
input[type=text]{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px;margin-top:18px}
.info{font-size:13px;color:var(--sub);margin-top:12px;line-height:1.6}

#busy{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid #fff4;border-top-color:#fff;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:#222c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:88vw;text-align:center;transition:opacity .3s}
.tip{margin:0 16px 10px;padding:10px 12px;border-radius:12px;background:var(--card);font-size:13px;line-height:1.6}
.tip b{color:var(--pri)}
#cvStatus{font-size:12px;color:var(--sub);padding:0 16px 6px}
</style>
</head>
<body>

<!-- 首頁 -->
<section id="home" class="screen">
  <header>
    <h1>掃描文件</h1>
    <button class="ghost" id="clearBtn">清除全部</button>
  </header>
  <div class="tip">📌 <b>拍照小提醒:</b>文件和背景的顏色要差很多才好自動裁切,例如<b>白紙放在深色桌面</b>上拍;四個角都要拍進畫面裡,紙盡量放平。</div>
  <div id="cvStatus">加強版找框引擎下載中…(不影響使用,可以直接拍)</div>
  <div id="grid"></div>
  <div class="bar">
    <button class="btn" id="camBtn">📷 拍照</button>
    <button class="btn" id="albumBtn">🖼 相簿</button>
    <button class="btn pri" id="exportBtn" disabled>分享</button>
  </div>
  <input type="file" id="camInput" accept="image/*" capture="environment" hidden>
  <input type="file" id="albumInput" accept="image/*" multiple hidden>
</section>

<!-- 裁切 -->
<section id="crop" class="screen dark hidden">
  <div class="top">
    <button class="tbtn" id="cropCancel">取消</button>
    <div class="t" id="cropTitle">拉四個角對齊文件</div>
    <button class="tbtn go" id="cropOk">下一步</button>
  </div>
  <div class="stageWrap" id="stageWrap">
    <div id="stage">
      <canvas id="stageCv"></canvas>
      <svg id="poly"><polygon fill="rgba(76,141,255,.18)" stroke="#4c8dff" stroke-width="2.5"/></svg>
      <div class="handle" data-i="0"></div><div class="handle" data-i="1"></div>
      <div class="handle" data-i="2"></div><div class="handle" data-i="3"></div>
      <div class="ehandle" data-e="0"></div><div class="ehandle" data-e="1"></div>
      <div class="ehandle" data-e="2"></div><div class="ehandle" data-e="3"></div>
    </div>
    <canvas id="loupe" width="300" height="300" class="hidden"></canvas>
  </div>
  <div class="hint">按住角或邊中間拖曳,上方放大鏡可以對準;不用剛好點在圓點上</div>
  <div class="tools">
    <button class="tool" id="cropAuto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="M9 12l2 2 4-4"/></svg>自動偵測</button>
    <button class="tool" id="cropFull"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="1"/></svg>整張照片</button>
  </div>
</section>

<!-- 單頁編輯 -->
<section id="edit" class="screen dark hidden">
  <div class="top">
    <button class="tbtn" id="editBack">返回</button>
    <div class="t" id="editTitle">第 1 頁</div>
    <button class="tbtn go" id="editDone">完成</button>
  </div>
  <div class="preview"><img id="editImg" alt=""></div>
  <div class="chips" id="filters">
    <button class="chip" data-f="orig">原色</button>
    <button class="chip" data-f="enhance">增強</button>
    <button class="chip" data-f="gray">灰階</button>
    <button class="chip" data-f="bw">黑白</button>
  </div>
  <div class="tools">
    <button class="tool" id="rotL"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4v6h6"/><path d="M3.5 10A9 9 0 1 1 6 18.5"/></svg>左轉</button>
    <button class="tool" id="rotR"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 4v6h-6"/><path d="M20.5 10A9 9 0 1 0 18 18.5"/></svg>右轉</button>
    <button class="tool" id="recrop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>重新裁切</button>
    <button class="tool" id="moveUp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>往前</button>
    <button class="tool" id="moveDn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>往後</button>
    <button class="tool danger" id="delPage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>刪除</button>
  </div>
</section>

<!-- 匯出 -->
<div class="mask hidden" id="exportMask">
  <div class="sheet">
    <h2>分享 / 儲存</h2>
    <div class="lbl">檔名</div>
    <input type="text" id="fname">
    <div class="lbl">格式</div>
    <div class="seg" id="fmtSeg"><button data-v="pdf" class="on">PDF(合成一份)</button><button data-v="jpg">JPG(每頁一張)</button></div>
    <div id="sizeBox">
      <div class="lbl">PDF 頁面大小</div>
      <div class="seg" id="sizeSeg"><button data-v="a4" class="on">A4</button><button data-v="fit">跟照片一樣</button></div>
    </div>
    <div class="info" id="expInfo">準備中…</div>
    <div class="row">
      <button class="btn" id="saveBtn" disabled>💾 存到手機</button>
      <button class="btn pri" id="shareBtn" disabled>傳 LINE / 寄信</button>
    </div>
    <div class="info" id="shareTip"></div>
    <div class="row"><button class="btn" id="expClose">關閉</button></div>
  </div>
</div>

<div id="busy" class="hidden"><div class="spin"></div><div id="busyTxt">處理中…</div></div>
<div id="toast" style="opacity:0"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const BUILD = '20261029g';
const $ = s => document.querySelector(s);
const show = (el, on = true) => el.classList.toggle('hidden', !on);
const nextFrame = () => new Promise(r => { requestAnimationFrame(() => setTimeout(r, 0)); setTimeout(r, 80); });

let toastT;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, ms);
}
async function busy(txt, fn) {
  $('#busyTxt').textContent = txt; show($('#busy'));
  await nextFrame();
  try { return await fn(); } finally { show($('#busy'), false); }
}

/* ---------- OpenCV(只用來偵測文件邊框;載不到也能手動拉角) ---------- */
let cvState = 'loading';
(function loadCV() {
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js';
  s.async = true;
  s.onerror = () => setCv('fail');
  document.head.appendChild(s);
  const t0 = Date.now();
  (function chk() {
    const c = window.cv;
    if (c && c.Mat) return setCv('ready');
    if (c && typeof c.then === 'function' && !c.__hooked) {
      c.__hooked = 1;
      c.then(m => { if (m && m.Mat) { window.cv = m; setCv('ready'); } });
    }
    if (cvState !== 'loading') return;
    if (Date.now() - t0 > 60000) return setCv('fail');
    setTimeout(chk, 200);
  })();
})();
function setCv(st) {
  if (cvState === 'ready') return;
  cvState = st;
  const el = $('#cvStatus');
  if (st === 'ready') { el.textContent = ''; show(el, false); }
  else if (st === 'fail') el.textContent = '加強版找框引擎沒下載成功,仍可自動找框,只是複雜背景可能較不準';
}

/* ---------- 資料 ---------- */
// page: {file, quad, baseBlob, filter, rot, outBlob, thumb, w, h}
const pages = [];
let queue = [];         // 等待裁切的檔案
let crop = null;        // {file, src(canvas), quad, pageIdx}
let editIdx = -1;

function loadImg(blob) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('圖片讀取失敗')); };
    img.src = url;
  });
}
async function fileToCanvas(file, max = 3200) {
  const img = await loadImg(file);
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c;
}
const toBlob = (c, q = 0.9) => new Promise(r => c.toBlob(r, 'image/jpeg', q));
function freeCanvas(c) { if (c) { c.width = c.height = 0; } } // iOS 記憶體要手動釋放

/* ---------- 邊框偵測 ---------- */
function orderPts(p) {
  const cx = p.reduce((a, q) => a + q.x, 0) / 4, cy = p.reduce((a, q) => a + q.y, 0) / 4;
  const s = [...p].sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));
  let k = 0;
  s.forEach((q, i) => { if (q.x + q.y < s[k].x + s[k].y) k = i; });
  return [0, 1, 2, 3].map(i => s[(k + i) % 4]); // 左上、右上、右下、左下
}
function defaultQuad(W, H, m = 0.06) {
  return [{x:W*m,y:H*m},{x:W*(1-m),y:H*m},{x:W*(1-m),y:H*(1-m)},{x:W*m,y:H*(1-m)}];
}
function detectQuad(src) {
  const W = src.width, H = src.height, s = Math.min(1, 1000 / Math.max(W, H));
  const sm = document.createElement('canvas');
  sm.width = Math.round(W * s); sm.height = Math.round(H * s);
  sm.getContext('2d').drawImage(src, 0, 0, sm.width, sm.height);
  let q = null;
  if (cvState === 'ready') try { q = cvDetect(sm); } catch (e) { console.warn('cv detect', e); }
  if (!q) try { q = jsDetect(sm); } catch (e) { console.warn('js detect', e); }
  freeCanvas(sm);
  return q && q.map(p => ({ x: p.x / s, y: p.y / s }));
}
// 用幾種方法各找候選框,打分數挑最好的:
//  ① 亮度分割:白紙通常比桌面亮,不會被木紋之類的花紋干擾
//  ② 找線條:紙跟桌面一樣亮時的備案
function cvDetect(c) {
  const area = c.width * c.height, mats = [], cands = [];
  const M = m => (mats.push(m), m);
  try {
    const src = M(cv.imread(c)), gray = M(new cv.Mat()), mn = M(new cv.Mat());
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    // 三色取最小值:白紙三色都高,木頭、彩色桌面至少有一色偏低,對比更明顯
    const ch = new cv.MatVector(); cv.split(src, ch);
    const r = ch.get(0), g = ch.get(1), b = ch.get(2);
    cv.min(r, g, mn); cv.min(mn, b, mn);
    [r, g, b, ch].forEach(m => m.delete());
    const kBig = M(cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(9, 9)));
    const kSm = M(cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(5, 5)));
    for (const base of [gray, mn]) {
      const bl = M(new cv.Mat()), bin = M(new cv.Mat());
      cv.GaussianBlur(base, bl, new cv.Size(7, 7), 0);
      cv.threshold(bl, bin, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
      cv.morphologyEx(bin, bin, cv.MORPH_OPEN, kBig);
      cv.morphologyEx(bin, bin, cv.MORPH_CLOSE, kBig);
      collectQuads(bin, area, cv.RETR_EXTERNAL, 1, cands);
      cv.Canny(bl, bin, 40, 120);
      cv.morphologyEx(bin, bin, cv.MORPH_CLOSE, kSm);
      collectQuads(bin, area, cv.RETR_LIST, 0.9, cands);
    }
  } finally { mats.forEach(m => m.delete()); }
  if (!cands.length) return null;
  cands.sort((a, b) => b.score - a.score);
  return cands[0].pts;
}
// 不靠 OpenCV 的找框:白紙比桌面亮 → 切出最大的亮色區塊 → 取四個最外側的點當角
// 辨識引擎還沒下載完(或下載失敗)也能用
function jsDetect(c0) {
  const s = Math.min(1, 800 / Math.max(c0.width, c0.height));
  const W = Math.round(c0.width * s), H = Math.round(c0.height * s), n = W * H;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  c.getContext('2d').drawImage(c0, 0, 0, W, H);
  const d = c.getContext('2d').getImageData(0, 0, W, H).data; freeCanvas(c);
  let best = null;
  for (const mode of ['min', 'gray']) {
    const v = new Uint8Array(n);
    for (let i = 0, k = 0; i < n; i++, k += 4)
      v[i] = mode === 'min' ? Math.min(d[k], d[k+1], d[k+2]) : (d[k] * 77 + d[k+1] * 150 + d[k+2] * 29) >> 8;
    // 紙上有陰影時,自動算出的亮度門檻會把暗的那半張切掉,所以也試低一點的門檻
    const t0 = otsu(v);
    for (const f of [1, 0.8, 0.65]) {
    const t = t0 * f;
    let m = new Uint8Array(n);
    for (let i = 0; i < n; i++) m[i] = v[i] > t ? 1 : 0;
    const r = Math.max(2, Math.round(Math.max(W, H) / 200));
    m = morph(morph(m, W, H, r, 0), W, H, r, 1);           // 先侵蝕再膨脹:切斷跟桌面亮紋的細連結
    const comp = largestBlob(m, W, H);
    if (!comp) continue;
    const had = best;
    for (const q of comp.quads) {
      const qa = Math.abs(polyArea(q)), fill = comp.count / qa;
      if (qa > n * 0.1 && qa < n * 0.97 && fill > 0.85 && fill < 1.1 && quadAngles(q).every(a => a > 45 && a < 135)) {
        const score = qa * Math.pow(Math.min(fill, 1 / fill), 4);
        if (!best || score > best.score) best = { q, score };
      }
    }
    if (best !== had) break;      // 這個門檻找到了就不再放寬(放寬容易把桌面亮處也框進來)
    }
  }

    const k = view.k, dx = (e.clientX - drag.sx) / k, dy = (e.clientY - drag.sy) / k;
    const W = crop.src.width, H = crop.src.height;
    const cl = p => ({ x: Math.max(0, Math.min(W, p.x)), y: Math.max(0, Math.min(H, p.y)) });
    if (drag.type === 'c') {
      const p = drag.q0[drag.i]; crop.quad[drag.i] = cl({ x: p.x + dx, y: p.y + dy });
    } else {
      // 整條邊沿著垂直方向平移
      const i = drag.i, j = (i + 1) % 4, a = drag.q0[i], b = drag.q0[j];
      let nx = a.y - b.y, ny = b.x - a.x; const len = Math.hypot(nx, ny) || 1; nx /= len; ny /= len;
      const t = dx * nx + dy * ny;
      crop.quad[i] = cl({ x: a.x + nx * t, y: a.y + ny * t }); crop.quad[j] = cl({ x: b.x + nx * t, y: b.y + ny * t });
    }
    drawQuad(); drawLoupe(e);
  });
  const end = e => { if (!drag || e.pointerId !== drag.id) return; drag = null; show($('#loupe'), false); drawQuad(); };
  wrap.addEventListener('pointerup', end); wrap.addEventListener('pointercancel', end);
}
addEventListener('resize', () => { if (!$('#crop').classList.contains('hidden')) layoutStage(); });
$('#cropAuto').onclick = () => {
  const q = detectQuad(crop.src);
  if (q) { crop.quad = q; drawQuad(); } else toast('沒找到文件邊緣,請手動拉四個角');
};
$('#cropFull').onclick = () => { crop.quad = defaultQuad(crop.src.width, crop.src.height, 0); drawQuad(); };
$('#cropCancel').onclick = () => {
  const idx = crop.pageIdx; closeCrop();
  if (idx >= 0) openEdit(idx); else { goHome(); nextInQueue(); }
};
function closeCrop() { if (crop) freeCanvas(crop.src); crop = null; freeCanvas($('#stageCv')); }
$('#cropOk').onclick = () => commitCrop(false);
async function commitCrop(auto) {
  const q = orderPts(crop.quad);
  if (Math.abs(polyArea(q)) < 400) return toast('框太小了,把四個角拉開一點');
  let idx = crop.pageIdx;
  await busy('裁切校正中…', async () => {
    const out = warp(crop.src, q);
    const baseBlob = await toBlob(out, 0.92); freeCanvas(out);
    let p;
    if (idx >= 0) { p = pages[idx]; p.quad = q; p.baseBlob = baseBlob; }
    else { p = { file: crop.file, quad: q, baseBlob, filter: 'enhance', rot: 0 }; pages.push(p); idx = pages.length - 1; }
    await renderPage(p);
  });
  closeCrop();
  if (queue.length) { goHome(); nextInQueue(); }
  else {
    openEdit(idx);
    if (auto) toast('已自動裁切好了;邊框不準可以按「重新裁切」', 3500);
  }
}
function polyArea(q) { let a = 0; for (let i = 0; i < 4; i++) { const p = q[i], n = q[(i + 1) % 4]; a += p.x * n.y - n.x * p.y; } return a / 2; }

/* ---------- 單頁編輯 ---------- */
function openEdit(i) {
  editIdx = i;
  show($('#home'), false); show($('#crop'), false); show($('#edit'));
  refreshEdit();
}
function refreshEdit() {
  const p = pages[editIdx];
  $('#editTitle').textContent = `第 ${editIdx + 1} / ${pages.length} 頁`;
  $('#editImg').src = p.outUrl;
  document.querySelectorAll('#filters .chip').forEach(c => c.classList.toggle('on', c.dataset.f === p.filter));
  $('#moveUp').disabled = editIdx === 0; $('#moveDn').disabled = editIdx === pages.length - 1;
  $('#moveUp').style.opacity = editIdx === 0 ? .35 : 1; $('#moveDn').style.opacity = editIdx === pages.length - 1 ? .35 : 1;
}
async function rerender() { await busy('處理中…', () => renderPage(pages[editIdx])); refreshEdit(); }
$('#filters').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  const p = pages[editIdx]; if (p.filter === c.dataset.f) return;
  p.filter = c.dataset.f; rerender();
});
$('#rotL').onclick = () => { pages[editIdx].rot -= 90; rerender(); };
$('#rotR').onclick = () => { pages[editIdx].rot += 90; rerender(); };
$('#recrop').onclick = () => { const p = pages[editIdx]; openCrop(p.file, p.quad, editIdx).catch(e => toast(e.message)); };
$('#moveUp').onclick = () => { if (editIdx > 0) { [pages[editIdx - 1], pages[editIdx]] = [pages[editIdx], pages[editIdx - 1]]; editIdx--; refreshEdit(); } };
$('#moveDn').onclick = () => { if (editIdx < pages.length - 1) { [pages[editIdx + 1], pages[editIdx]] = [pages[editIdx], pages[editIdx + 1]]; editIdx++; refreshEdit(); } };
$('#delPage').onclick = () => {
  if (!confirm('刪除這一頁?')) return;
  const [p] = pages.splice(editIdx, 1); if (p.outUrl) URL.revokeObjectURL(p.outUrl);
  goHome();
};
$('#editBack').onclick = $('#editDone').onclick = () => goHome();
function goHome() { show($('#crop'), false); show($('#edit'), false); show($('#home')); renderGrid(); }
$('#clearBtn').onclick = () => {
  if (!confirm(`清除全部 ${pages.length} 頁?`)) return;
  pages.forEach(p => p.outUrl && URL.revokeObjectURL(p.outUrl)); pages.length = 0; renderGrid();
};

/* ---------- 匯出 / 分享 ---------- */
const exp = { fmt: 'pdf', size: 'a4', files: null, token: 0 };
function defaultName() {
  const d = new Date(), z = n => String(n).padStart(2, '0');
  return `掃描_${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}`;
}
function safeName() { return ($('#fname').value.trim() || defaultName()).replace(/[\\/:*?"<>|]/g, '_'); }
$('#exportBtn').onclick = () => {
  $('#fname').value = defaultName();
  show($('#exportMask')); shareTip(); prepare();
};
$('#expClose').onclick = () => show($('#exportMask'), false);
$('#exportMask').addEventListener('click', e => { if (e.target.id === 'exportMask') show($('#exportMask'), false); });
for (const [seg, key] of [['#fmtSeg', 'fmt'], ['#sizeSeg', 'size']]) {
  $(seg).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    exp[key] = b.dataset.v;
    $(seg).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    show($('#sizeBox'), exp.fmt === 'pdf');
    shareTip(); prepare();
  });
}
$('#fname').addEventListener('input', () => { clearTimeout(exp.nt); exp.nt = setTimeout(prepare, 400); });

// iPhone 分享選單收到網頁給的 PDF 時不會列出 LINE(LINE 只接照片),所以 PDF 要繞道「檔案」
function shareTip() {
  $('#shareTip').innerHTML = exp.fmt === 'pdf'
    ? '<b>PDF 傳 LINE:</b>分享選單裡通常沒有 LINE。請在選單選「儲存到檔案」,再到 LINE 聊天室按「+」→「檔案」選這份 PDF。<br><b>寄信:</b>選單裡選「郵件」就會自動附上。<br>想直接傳 LINE,可以改選上面的 <b>JPG</b>。'
    : '按「傳 LINE / 寄信」會跳出分享選單,選 LINE 或郵件就能直接傳圖片。';
  $('#shareBtn').textContent = exp.fmt === 'pdf' ? '寄信 / 存檔案' : '傳 LINE / 寄信';
}

// 先把檔案做好,按「分享」時才能立刻叫出分享選單(iPhone 要求要在點擊當下)
async function prepare() {
  const my = ++exp.token;
  exp.files = null; $('#shareBtn').disabled = $('#saveBtn').disabled = true;
  $('#expInfo').textContent = '準備檔案中…';
  await nextFrame();
  try {
    const name = safeName(); let files;
    if (exp.fmt === 'pdf') files = [new File([await makePdf()], name + '.pdf', { type: 'application/pdf' })];
    else files = pages.map((p, i) => new File([p.outBlob], pages.length > 1 ? `${name}_${i + 1}.jpg` : `${name}.jpg`, { type: 'image/jpeg' }));
    if (my !== exp.token) return;
    exp.files = files;
    const kb = files.reduce((a, f) => a + f.size, 0) / 1024;
    $('#expInfo').textContent = `${files.length} 個檔案,共 ${kb > 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.round(kb) + ' KB'}`;
    $('#shareBtn').disabled = $('#saveBtn').disabled = false;
  } catch (e) {
    if (my === exp.token) $('#expInfo').textContent = '產生失敗:' + e.message;
  }
}
async function makePdf() {
  if (!window.jspdf) throw new Error('PDF 元件沒載入,請確認網路後重新整理');
  const { jsPDF } = window.jspdf;
  let doc;
  for (const p of pages) {
    const data = new Uint8Array(await p.outBlob.arrayBuffer());
    const land = p.w > p.h;
    let pw, ph;
    if (exp.size === 'a4') { pw = land ? 297 : 210; ph = land ? 210 : 297; }
    else { pw = land ? 297 : 210; ph = pw * p.h / p.w; }
    const fmt = [pw, ph], ori = pw > ph ? 'l' : 'p';
    if (!doc) doc = new jsPDF({ unit: 'mm', format: fmt, orientation: ori, compress: true });
    else doc.addPage(fmt, ori);
    const s = Math.min(pw / p.w, ph / p.h), w = p.w * s, h = p.h * s;
    doc.addImage(data, 'JPEG', (pw - w) / 2, (ph - h) / 2, w, h, undefined, 'FAST');
  }
  return doc.output('blob');
}
$('#shareBtn').onclick = async () => {
  const files = exp.files; if (!files) return;
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files }); }
    catch (e) { if (e.name !== 'AbortError') toast('分享失敗:' + e.message); }
  } else {
    download(files);
    toast('這個瀏覽器不能直接分享,已改成下載,再從「檔案」傳出去', 4000);
  }
};
$('#saveBtn').onclick = () => {
  const files = exp.files; if (!files) return;
  // iPhone 上用分享選單的「儲存到檔案」/「儲存影像」最穩
  if (/iPhone|iPad|iPod/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files })) {
    toast('請在選單中選「儲存到檔案」或「儲存影像」', 3500);
    navigator.share({ files }).catch(() => {});
  } else download(files);
};
function download(files) {
  files.forEach((f, i) => setTimeout(() => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }, i * 400));
}

/* ---------- 離線 + 更新 ---------- */
renderGrid();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
addEventListener('beforeunload', e => { if (pages.length) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
